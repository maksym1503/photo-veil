name: PhotoVeil CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core Image and geometry tests
        run: swift test
      - name: Build app and run simulator UI tests
        run: xcodebuild -project PhotoVeil.xcodeproj -scheme PhotoVeil -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -derivedDataPath /tmp/veil-ci CODE_SIGNING_ALLOWED=NO test
